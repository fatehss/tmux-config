# ─── General ──────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 1000000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0

# ─── Prefix ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Pane splitting (easier keys) ────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Pane navigation (Alt+arrow, no prefix needed) ──────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ─── Pane resizing (prefix + IJKL) ──────────────────────────
bind I resize-pane -U 3
bind K resize-pane -D 3
bind J resize-pane -L 3
bind L resize-pane -R 3

# ─── Quick reload ────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ─── Status bar ──────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "

set -g status-right-length 60
set -g status-right "#[fg=#565f89]%H:%M #[default]"

# Window list
# @claude_alert is set on a window by ~/.local/bin/claude-tmux-alert, driven
# by Claude Code's Notification / Stop hooks. Green means that tab's Claude
# wants you. Cleared by the after-select-window hook further down.
setw -g window-status-format "#{?@claude_alert,#[fg=#9ece6a#,bold],#[fg=#565f89]} #I:#W#{?@claude_alert, ●,} "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

# Visiting a tab clears its Claude alert.
set-hook -g after-select-window 'set-option -uw @claude_alert'

# monitor-activity's default style is `reverse`, which would invert the
# green and fight the alert. Neutralise it so Claude state is the only
# signal in the window list.
setw -g window-status-activity-style "default"

# ─── Pane border: idle detection (the Reddit trick) ─────────
# Active pane border: blue when busy, green when idle
# The hook fires every 5s via status-interval; pane border
# color is set by the monitor script below.
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# ─── Visual bell for pane activity ───────────────────────────
# ─── Copy to macOS clipboard on mouse select ────────────────
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

setw -g monitor-activity on
set -g visual-activity off
setw -g activity-action other

# ─── Plugins ─────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 5 min, auto-restore on tmux start
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
