# ─── General ──────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 1000000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0

# Forward the terminal's focus-in/out sequences to programs inside tmux, so
# vim's autoread, autosave-on-focus-lost, and TUI redraws fire when you switch
# panes. Ghostty reports focus; unrelated to the Claude tab lights below, which
# run off tmux's own select-pane/select-window hooks.
set -g focus-events on

# ─── Prefix ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Pane splitting (easier keys) ────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Pane navigation (Alt+arrow, no prefix needed) ──────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ─── Pane resizing (prefix + IJKL) ──────────────────────────
bind I resize-pane -U 3
bind K resize-pane -D 3
bind J resize-pane -L 3
bind L resize-pane -R 3

# ─── Quick reload ────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ─── Status bar ──────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "

set -g status-right-length 60
set -g status-right "#[fg=#565f89]%H:%M #[default]"

# Window list
# @claude_alert is set on a window by ~/.local/bin/claude-tmux-alert, driven
# by Claude Code's Notification / Stop hooks. Green means that tab's Claude
# wants you. Cleared by the after-select-window hook further down.
# Escalation ladder, by contrast against the #1a1b26 background:
#   idle      #565f89  2.8:1  normal
#   working   #bb9af7  7.4:1  normal  ◐   Claude is busy, nothing needed
#   needs you #9ece6a  9.4:1  bold    ●   your turn
# Salience tracks required action, so working never out-shouts needs-you.
setw -g window-status-format "#{?@claude_alert,#[fg=#9ece6a#,bold],#{?@claude_busy,#[fg=#bb9af7],#[fg=#565f89]}} #I:#W#{?@claude_alert, ●,#{?@claude_busy, ◐,}} "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

# Focusing a pane clears ITS needs-you flag. All three hooks are required
# because tmux reaches a pane by three different routes:
#   after-select-pane    clicking inside a pane, or prefix+arrow
#   after-select-window  prefix+<n>, next/previous-window
#   session-window-changed  clicking a tab in the status bar - that runs
#                        `switch-client -t =`, NOT select-window, so
#                        after-select-window alone silently misses mouse
#                        clicks entirely.
# @claude_busy is deliberately never cleared here: Claude is still working
# whether or not you are looking at it.
# #{pane_id} is expanded by tmux against the HOOK's target. Do not resolve it
# inside the script with an untargeted display-message: from run-shell that
# returns whatever window is *current*, which is only coincidentally the one
# the hook fired for.
set-hook -g after-select-pane      'run-shell -b "~/.local/bin/claude-tmux-alert seen #{pane_id}"'
set-hook -g after-select-window    'run-shell -b "~/.local/bin/claude-tmux-alert seen #{pane_id}"'
set-hook -g session-window-changed 'run-shell -b "~/.local/bin/claude-tmux-alert seen #{pane_id}"'

# Renaming a tab re-points its recorded Claude sessions at the new name.
# Window ids do not survive a tmux restart - a fresh server reassigns every
# @id - so the window NAME is the only durable key the index has. A session
# started before you named the tab was recorded under whatever
# automatic-rename had produced ("node", "less"), and would be orphaned on
# reboot without this.
set-hook -g after-rename-window 'run-shell -b "~/.local/bin/claude-tab-link --renamed --window #{window_id}"'

# monitor-activity's default style is `reverse`, which would invert the
# green and fight the alert. Neutralise it so Claude state is the only
# signal in the window list.
setw -g window-status-activity-style "default"

# ─── Pane borders ────────────────────────────────────────────
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Per-pane Claude state, drawn into each pane's top border.
#
# The border LINE colour cannot vary per pane - tmux accepts
# `set-option -p pane-border-style` but discards it, and the option never
# appears in the pane option table. The border FORMAT is evaluated per pane
# though, so @claude_state renders correctly here.
#
# Costs one screen row in total (the outermost pane), not one per pane.
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{@claude_state},alert},#[fg=#9ece6a#,bold] ● ready ,#{?#{==:#{@claude_state},busy},#[fg=#bb9af7] ◐ working ,#[fg=#565f89] }}#{b:pane_current_path} #[default]"

# ─── Visual bell for pane activity ───────────────────────────
# ─── Copy to macOS clipboard on mouse select ────────────────
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

setw -g monitor-activity on
set -g visual-activity off
setw -g activity-action other

# ─── Plugins ─────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 5 min, auto-restore on tmux start
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
